<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр по географии</title>
<style>
:root{--bg:#f6f6f6;--card:#ffffff;--ink:#222222;--mute:#666666;--line:#c8c8c8;--accent:#2a5db0;--onacc:#ffffff;--ok:#dff3e3;--okt:#1d6b2f;--bad:#f8dede;--badt:#9b1c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--card:#262626;--ink:#e8e8e8;--mute:#a0a0a0;--line:#444444;--accent:#6ea3f0;--onacc:#101010;--ok:#1d3a25;--okt:#8fdca3;--bad:#432020;--badt:#f0a0a0}}
:root[data-theme="dark"]{--bg:#1b1b1b;--card:#262626;--ink:#e8e8e8;--mute:#a0a0a0;--line:#444444;--accent:#6ea3f0;--onacc:#101010;--ok:#1d3a25;--okt:#8fdca3;--bad:#432020;--badt:#f0a0a0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Arial,"Segoe UI",Helvetica,sans-serif;font-size:16px;color:var(--ink);background:var(--bg);background-image:linear-gradient(rgba(120,120,120,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(120,120,120,.12) 1px,transparent 1px);background-size:32px 32px;border-top:6px solid var(--accent);line-height:1.45}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:0 0 6px}
h2{font-size:20px;margin:0 0 14px;font-weight:600}
.lead{color:var(--mute);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.tbar{display:flex;justify-content:flex-end;margin-bottom:8px}
button{font:inherit;color:inherit;cursor:pointer}
.modes{display:grid;gap:10px}
.mode{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.mode:hover{border-color:var(--accent)}
.mode b{display:block;font-size:17px}
.mode span{color:var(--mute);font-size:14px}
.mode small{margin-left:auto;color:var(--mute);font-size:13px;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.q{margin:0 0 14px}
#flag{display:none;margin:0 0 14px;width:min(100%,240px)}
#flag svg{display:block;width:100%;height:auto;border:1px solid var(--line);background:#fff}
.opts{display:grid;gap:8px}
.opt{width:100%;text-align:left;padding:10px 12px;border-radius:5px;border:1px solid var(--line);background:var(--card);font-size:16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok);border-color:var(--okt);color:var(--okt)}
.opt.bad{background:var(--bad);border-color:var(--badt);color:var(--badt)}
.fb{min-height:24px;margin:12px 0 4px}
.primary{background:var(--accent);color:var(--onacc);border:0;border-radius:5px;padding:10px 18px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:5px;padding:9px 16px}
.ghost.theme{padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.score{font-size:40px;font-weight:700;margin:6px 0}
ul.err{padding-left:18px;margin:6px 0 0}
ul.err li{margin:4px 0}
.head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.head h1{margin:0}
.globe{width:56px;height:56px;flex:none;color:var(--accent)}
.ic{width:28px;height:28px;flex:none;color:var(--accent)}
.stars{font-size:26px;color:#e0a020;letter-spacing:4px}
.lvbox{margin-bottom:16px}
.lvl{font-size:14px;color:var(--mute);margin-bottom:6px}
.lvrow{display:flex;gap:8px;flex-wrap:wrap}
.lv{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:8px 14px}
.lv.on{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.lvd{color:var(--mute);font-size:14px;margin:8px 0 0}
#timer{font-weight:700}
.hide{display:none}
</style>
</head>
<body>
<main>
<div class="tbar"><button class="ghost theme" id="theme" type="button" aria-label="Сменить тему"></button></div>
<section id="menu">
<div class="head"><svg class="globe" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="32" cy="32" r="28"/><ellipse cx="32" cy="32" rx="12" ry="28"/><path d="M32 4v56M4 32h56M8 20h48M8 44h48"/></g></svg><h1>Тренажёр по географии</h1></div>
<p class="lead">Проект по географии, 9 класс. В каждом режиме 10 вопросов, в конце показываются результат и ошибки.</p>

<div class="modes">
<button class="mode" data-mode="flag"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V3M5 4h13l-3 4 3 4H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><div><b>Флаги</b><span>Определить страну по флагу</span></div><small id="r-flag"></small></button>
<button class="mode" data-mode="cap"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="11" r="2" fill="currentColor"/></svg><div><b>Столицы</b><span>Назвать столицу страны</span></div><small id="r-cap"></small></button>
<button class="mode" data-mode="cont"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg><div><b>Части света</b><span>В какой части света страна</span></div><small id="r-cont"></small></button>
<button class="mode" data-mode="fact"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><div><b>Вопросы</b><span>Реки, горы, моря, страны</span></div><small id="r-fact"></small></button>
</div>
</section>

<section id="game" class="hide">
<div class="top"><span id="num"></span><span id="timer"></span><span id="streak"></span></div>
<div class="bar"><i id="prog"></i></div>
<div class="box">
<div id="flag"></div>
<h2 class="q" id="q"></h2>
<div class="opts" id="opts"></div>
<div class="fb" id="fb" aria-live="polite"></div>
<button class="primary hide" id="next">Дальше</button>
</div>
</section>

<section id="end" class="hide">
<div class="box">
<h2 id="endTitle"></h2>
<div class="score" id="endScore"></div>
<div class="stars" id="endStars" aria-hidden="true"></div>
<p id="endText"></p>
<div id="errBox" class="hide"><b>Над чем поработать</b><ul class="err" id="errList"></ul></div>
<div class="row"><button class="primary" id="again">Ещё раз</button><button class="ghost" id="toMenu">В меню</button></div>
</div>
</section>
</main>

["Какая страна самая густонаселённая в Африке?","Нигерия",["Эфиопия","Египет","ДР Конго","ЮАР","Танзания"],3],
["Какой полуостров самый большой в мире?","Аравийский",["Индостан","Скандинавский","Индокитай","Лабрадор","Сомали"],3],

["У какого материка находится мыс Горн?","Южная Америка",["Африка","Антарктида","Австралия","Северная Америка"],3]

var PARTS=["Европа","Азия","Африка","Северная Америка","Южная Америка","Австралия и Океания"];
var CHEER=["Верно!"];
var N=10,mode,qs,i,score,streak,wrong,locked;
function $(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function store(k,v){try{if(v===undefined){return localStorage.getItem(k)}localStorage.setItem(k,v)}catch(e){return null}}
function show(id){["menu","game","end"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
var LV={easy:{n:3,easy:1,near:0,time:0},medium:{n:4,easy:0,near:0,time:0},hard:{n:6,easy:0,near:1,time:20}};
var LN={easy:"Лёгкий",medium:"Средний",hard:"Сложный"};
var LD={easy:"Известные страны и простые вопросы, 3 варианта ответа.",medium:"Все страны и вопросы средней трудности, 4 варианта ответа.",hard:"Малоизвестные страны и трудные вопросы, 6 вариантов с похожими ответами, 20 секунд на вопрос."};
var EASY=["Франция","Германия","Италия","Испания","Великобритания","Россия","Китай","Япония","Индия","США","Бразилия","Египет","Канада","Австралия","Польша","Украина","Турция","Мексика","Белоруссия","Греция","Швеция"];
var level=store("geo-level");if(!LV[level]){level="medium"}
var playLevel,tm,left;
function cont(name){for(var k=0;k<D.length;k++){if(D[k][0]===name){return D[k][2]}}return null}
function records(){["flag","cap","cont","fact"].forEach(function(m){var r=store("geo-"+m+"-"+level);$("r-"+m).textContent=r?"рекорд "+r+"/"+N:""})}
function paintLevel(){Array.prototype.forEach.call(document.querySelectorAll(".lv"),function(b){b.classList.toggle("on",b.getAttribute("data-lv")===level)});$("lvd").textContent=LD[level];records()}
Array.prototype.forEach.call(document.querySelectorAll(".lv"),function(b){b.onclick=function(){level=b.getAttribute("data-lv");store("geo-level",level);paintLevel()}});
function others(list,item,idx,k,near){var l=list.filter(function(x){return x!==item}),c=near?cont(item[0]):null;if(c){var same=shuffle(l.filter(function(x){return cont(x[0])===c}));l=same.concat(shuffle(l.filter(function(x){return cont(x[0])!==c})))}else{l=shuffle(l)}return l.slice(0,k).map(function(x){return x[idx]})}
function build(m){
var c=LV[level];
function ok(d){return c.easy?EASY.indexOf(d[0])>=0:level==="hard"?EASY.indexOf(d[0])<0:true}
if(m==="fact"){return shuffle(FACTS.filter(function(f){return level==="easy"?f[3]===1:level==="medium"?f[3]<=2:f[3]===3})).slice(0,N).map(function(f){return{t:f[0],a:f[1],o:shuffle([f[1]].concat(shuffle(f[2]).slice(0,c.n-1)))}})}
if(m==="flag"){return shuffle(FL.filter(ok)).slice(0,N).map(function(d){return{t:"Чей это флаг?",f:d[1],a:d[0],o:shuffle([d[0]].concat(others(FL,d,0,c.n-1,c.near)))}})}
var pool=D.filter(ok);if(m==="cont"){pool=pool.filter(function(d){return d[2]})}
return shuffle(pool).slice(0,N).map(function(d){
if(m==="cap"){return{t:"Столица страны «"+d[0]+"»?",a:d[1],o:shuffle([d[1]].concat(others(D,d,1,c.n-1,c.near)))}}
var ex=shuffle(PARTS.filter(function(p){return p!==d[2]})).slice(0,c.n-1).concat([d[2]]);
return{t:"В какой части света находится страна «"+d[0]+"»?",a:d[2],o:PARTS.filter(function(p){return ex.indexOf(p)>=0})}})}
function start(m){mode=m;playLevel=level;qs=build(m);i=0;score=0;streak=0;wrong=[];show("game");ask()}
function wr(q){return (q.f?"Флаг: ":q.t+" Ответ: ")+q.a}
function reveal(q,chosen){
Array.prototype.forEach.call($("opts").children,function(b){b.disabled=true;if(b.textContent===q.a){b.classList.add("ok")}});
if(chosen){chosen.classList.add("bad")}
$("next").textContent=i===N-1?"Показать результат":"Дальше";
$("next").classList.remove("hide");$("next").focus();
}
function ask(){
clearInterval(tm);
locked=false;var q=qs[i];
$("num").textContent="Вопрос "+(i+1)+" из "+N;
$("streak").textContent=streak>1?"Серия: "+streak:"";
$("prog").style.width=(i/N*100)+"%";
$("q").textContent=q.t;$("fb").textContent="";
var fl=$("flag");
if(q.f){fl.innerHTML='<svg viewBox="0 0 30 20" role="img" aria-label="Флаг страны">'+q.f+'</svg>';fl.style.display="block"}else{fl.innerHTML="";fl.style.display="none"}
$("next").classList.add("hide");
var box=$("opts");box.innerHTML="";
q.o.forEach(function(text){var b=document.createElement("button");b.className="opt";b.type="button";b.textContent=text;b.onclick=function(){pick(b,text)};box.appendChild(b)});
var t=LV[playLevel].time;
if(t){left=t;$("timer").textContent="Время: "+left+" с";tm=setInterval(function(){left--;$("timer").textContent="Время: "+left+" с";if(left<=0){clearInterval(tm);if(!locked){locked=true;streak=0;wrong.push(wr(q));$("fb").textContent="Время вышло. Правильный ответ: "+q.a;reveal(q,null)}}},1000)}else{$("timer").textContent=""}
}
function pick(btn,text){
if(locked)return;locked=true;clearInterval(tm);var q=qs[i];
if(text===q.a){score++;streak++;$("fb").textContent="Верно!";reveal(q,null)}
else{streak=0;wrong.push(wr(q));$("fb").textContent="Неверно. Правильный ответ: "+q.a;reveal(q,btn)}
}
function finish(){
clearInterval(tm);
$("prog").style.width="100%";
var key="geo-"+mode+"-"+playLevel;var best=parseInt(store(key)||"0",10),isNew=score>best;
if(isNew){store(key,String(score))}
$("endTitle").textContent=score===N?"Без ошибок":score>=7?"Отличный результат":score>=4?"Неплохо, есть что подтянуть":"Попробуй ещё раз";
$("endScore").textContent=score+" / "+N;
var st=score>=9?3:score>=6?2:score>=3?1:0;$("endStars").textContent="\u2605".repeat(st)+"\u2606".repeat(3-st);
$("endText").textContent=(isNew?"Новый рекорд!":"Рекорд: "+best+" из "+N+".")+" Уровень: "+LN[playLevel]+".";
var list=$("errList");list.innerHTML="";
wrong.forEach(function(w){var li=document.createElement("li");li.textContent=w;list.appendChild(li)});
$("errBox").classList.toggle("hide",!wrong.length);
show("end");records();
}
$("next").onclick=function(){i++;if(i>=N){finish()}else{ask()}};
$("again").onclick=function(){start(mode)};
$("toMenu").onclick=function(){records();show("menu")};
Array.prototype.forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.getAttribute("data-mode"))}});
var root=document.documentElement;
function curTheme(){var t=root.getAttribute("data-theme");if(t){return t}return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function paint(){$("theme").textContent=curTheme()==="dark"?"Светлая тема":"Тёмная тема"}
$("theme").onclick=function(){var n=curTheme()==="dark"?"light":"dark";root.setAttribute("data-theme",n);store("geo-theme",n);paint()};
var saved=store("geo-theme");if(saved==="dark"||saved==="light"){root.setAttribute("data-theme",saved)}
paint();
paintLevel();
</script>
</body>
</html>
